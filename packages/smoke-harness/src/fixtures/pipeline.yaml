name: smoke-pipeline
target: pipeline
agent:
  model: claude-sonnet-4-6
  instructions: |
    Smoke fixture for the pipeline shape. Use Retrieve to ground answers.
retrieve:
  embedderModel: mock/det
  vectorBackend: in-memory
  defaultK: 3
indexing:
  chunkStrategy: fixed
  chunkSize: 200
  chunkOverlap: 0
  documents:
    - id: doc-1
      text: the quick brown fox jumps over the lazy dog
    - id: doc-2
      text: lorem ipsum dolor sit amet consectetur adipiscing
