name: smoke-onchain
target: onchain
agent:
  model: claude-sonnet-4-6
  instructions: |
    Smoke fixture for the onchain shape. React to each event.
chains:
  - id: base-mainnet
    kind: evm
    rpcUrls:
      - $SMOKE_BASE_RPC
    rpcPolicy: single
    finality:
      kind: confirmations
      count: 12
    reorgTolerant: true
contracts:
  - id: treasury
    chainId: base-mainnet
    address: "0xtreasury0000000000000000000000000000smoke"
    abiRef: abi://safe
triggers:
  - kind: event
    chainId: base-mainnet
    contract: treasury
    event: Transfer
