name: runtime-smoke-cli
target: cli
agent:
  model: claude-sonnet-4-6
  instructions: |
    You are running inside the CrewHaus runtime-smoke harness. The user
    will give you the path to a file under /tmp/crewhaus-runtime-cli-*/
    that contains a single magic phrase.

    Your job: call the `read` tool exactly once with that file path, then
    reply with the magic phrase verbatim and stop. Do not invent a phrase
    from prior knowledge — the phrase is randomised per run so guessing
    will fail the test.
tools:
  - read
