name: runtime-smoke-browser
target: browser
# The harness serves its randomised magic-phrase page on http://127.0.0.1:<port>
# — a loopback target the SSRF floor refuses in two independent layers (the
# Navigate pre-goto guard, and the chromium backend's DNS-pinning proxy). Both
# refusals are correct for an ordinary harness and this is the narrow case they
# are not written for: the page is served by this very process, and the phrase
# on it is the only thing that can prove the agent really navigated and really
# read the screen. Opting in waives the private-host checks ONLY; the
# http/https scheme allowlist still applies.
driver:
  allowPrivateTargets: true
agent:
  model: claude-sonnet-4-6
  instructions: |
    You are running inside the CrewHaus runtime-smoke harness. The user
    will give you a URL on http://127.0.0.1 that contains a single magic
    phrase on the page.

    Your job: call Navigate with that URL, then call Screenshot to read
    the page, then report the magic phrase verbatim in your final reply.
    Do not answer from prior knowledge — the phrase is randomised per
    run, so guessing will fail the test.
# Every browser tool resolves to "ask" in `default` mode (readOnly/destructive
# are consulted only in `auto`), and this smoke drives a ONE-SHOT (`--prompt`)
# run: a non-interactive surface with no approvals store has nothing to prompt,
# so an unruled `ask` collapses into a denial in place and the agent reports it
# cannot proceed.
#
# `runRunBrowser` registers SEVEN tools and advertises all of them. The three
# read-only ones are ruled here: Navigate and Screenshot because the harness
# asserts on them, and FindElement because its description sells it to the
# model as the way to locate content on a page — a model that finds the
# screenshot hard to read reaches for it and hits the same denial.
#
# Click/Type/Key/Scroll are deliberately left UNRULED: this smoke never needs
# to mutate the page, and an unruled destructive tool failing closed is the
# outcome we want.
#
# `ask_mode: deny` is what makes "failing closed" still mean DENY here. Once
# the interpreter learned to honour ask_mode, an unruled `ask` on this
# non-interactive surface began PARKING instead: exit 36, no `browser_done`
# line, and — now that this shape is a hard gate — a red job. A denial keeps
# the turn running so the harness can still assert on what the agent grounded
# its answer in, which is the thing this smoke exists to measure. It also
# keeps the smoke from writing pending approvals nobody will ever grant.
permissions:
  ask_mode: deny
  rules:
    - type: alwaysAllow
      pattern: Navigate
    - type: alwaysAllow
      pattern: Screenshot
    - type: alwaysAllow
      pattern: FindElement
