apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "crewhaus.fullname" . }}
  labels:
    {{- include "crewhaus.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "crewhaus.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "crewhaus.labels" . | nindent 8 }}
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: crewhaus
          # image.digest (values.yaml) pins by content digest; tag is the default.
          image: "crewhaus/{{ .Values.target }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: CREWHAUS_TARGET
              value: {{ .Values.target | quote }}
            {{- if .Values.secrets.anthropic }}
            - name: ANTHROPIC_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.anthropic.secretName }}
                  key: {{ .Values.secrets.anthropic.key }}
            {{- end }}
            {{- if eq .Values.target "channel" }}
            - name: SLACK_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.slack.signing.secretName }}
                  key: {{ .Values.secrets.slack.signing.key }}
            - name: SLACK_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.slack.bot.secretName }}
                  key: {{ .Values.secrets.slack.bot.key }}
            {{- end }}
            {{- range .Values.secrets.provider }}
            - name: {{ .name }}
              valueFrom:
                secretKeyRef:
                  name: {{ .secretName }}
                  key: {{ .key }}
            {{- end }}
            {{- range .Values.extraEnv }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}
            {{- if .Values.otel.enabled }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.otel.endpoint | quote }}
            {{- if .Values.otel.headers }}
            - name: OTEL_EXPORTER_OTLP_HEADERS
              value: {{ .Values.otel.headers | quote }}
            {{- end }}
            {{- end }}
          {{- if has .Values.target (list "channel" "managed" "crew" "voice" "browser") }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          {{- else }}
          # Process-liveness only: `doctor --liveness` exits 0 without
          # credential/spec checks. Plain `doctor` always failed here —
          # /app/crewhaus.yaml never exists in the image.
          livenessProbe:
            exec:
              command: ["bun", "/app/crewhaus.js", "doctor", "--liveness"]
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            exec:
              command: ["bun", "/app/crewhaus.js", "doctor", "--liveness"]
            initialDelaySeconds: 2
            periodSeconds: 10
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: spec
              mountPath: /spec
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: spec
          configMap:
            name: {{ .Values.spec.configMap }}
        - name: tmp
          emptyDir: {}
