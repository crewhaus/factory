{{- if has .Values.target (list "channel" "managed" "crew" "voice" "browser") -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "crewhaus.fullname" . }}
  labels:
    {{- include "crewhaus.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ include "crewhaus.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
