name: CI

on:
  push:
    # A patch line (hardening/0.7.1) is integrated on its own branch and only
    # reaches main as the release PR. Until then nothing ran its CI: 0.7.1's
    # branch was pushed with a test that fails on Linux, and the Windows jobs
    # below had never run. So a pushed hardening branch runs the same jobs.
    branches: [main, "hardening/**"]
  pull_request:
    branches: [main]
  # Run the same jobs on any branch by hand: `gh workflow run ci.yml --ref <branch>`.
  workflow_dispatch:
  # release.yml `uses:` this workflow as a publish gate so a tagged tree that
  # would fail lint/typecheck/test can never ship. Reusing the CI job (rather
  # than duplicating the steps) keeps the release bar identical to the PR bar —
  # exactly how smoke-runtime.yml is reused. See release.yml's `ci` job.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    # A wedged test runner (bun 1.4.0 idled until GitHub's 6 h default) holds a
    # release too: release.yml's build waits on every job of this workflow. A
    # green run takes about 11 min.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # Pinned, not floated, and pinned to the supported floor
          # (apps/cli/src/bun-floor.ts; scripts/bun-floor.test.ts holds every
          # pin equal to it), so this job is what proves the floor before a
          # tag: release.yml's build waits on it.
          # - bun 1.4.0 (released 2026-08-19) wedges the Test step on
          #   ubuntu-latest: every package suite completes and
          #   `bun run --filter` then never exits, idling until the job
          #   timeout (runs 32820039193 and 32825788241).
          # - bun 1.3.11 fails @crewhaus/tool-safety on ubuntu-latest: a
          #   regex worker it terminated kept running for the whole batch,
          #   and its String.prototype.replace disagreed with the spec on a
          #   surrogate pair (run 36615945808). Both pass on 1.3.13 and 1.3.14
          #   on Linux arm64, on 1.3.14 on macOS, and with the x64 builds of
          #   1.3.13 and 1.3.14 on macOS under Rosetta.
          # Re-float once a 1.4.x fixes the parent-exit hang.
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        # Say WHICH package failed. `bun run --filter` over 220 packages prints
        # `<pkg> test: Exited with code 1` inline, the moment that package
        # finishes, and prints no summary at the end — so on a red job the tail
        # of the log shows only the slowest package (apps/cli, ~7 min) finishing
        # green, followed by a bare `error: script "test" exited with code 1`.
        # The failing package is thousands of lines up, past what the Actions
        # logs API will hand back, which makes a red run undiagnosable without
        # downloading the full archive. Reprint the offenders, with their
        # output, at the END of the step where they can actually be read.
        run: |
          set -o pipefail
          if bun run test 2>&1 | tee "${RUNNER_TEMP}/test-output.log"; then
            exit 0
          fi
          echo "::group::Packages that exited non-zero"
          grep -E "test: Exited with code [1-9]" "${RUNNER_TEMP}/test-output.log" \
            || echo "(no package did — the failure is in the post-fan-out step, bun test scripts)"
          echo "::endgroup::"
          for pkg in $(grep -oE "^[^ ]+ test: Exited with code [1-9]" "${RUNNER_TEMP}/test-output.log" | awk '{print $1}' | sort -u); do
            echo "::group::${pkg} — last 80 lines"
            grep -F "${pkg} test:" "${RUNNER_TEMP}/test-output.log" | tail -80
            echo "::endgroup::"
          done
          exit 1

      - name: Lint
        run: bun run lint

      # The pack pre-flight asks npm what each tarball would hold, and npm majors
      # disagree (npm 8 drops a `./NOTICE` entry that npm 11 packs; npm 12 packs
      # a `NOTICE/` entry that npm 11 drops). So it runs the npm line the release
      # job publishes with: the same Node and npm pin as release.yml's publish
      # job. After Test, so the suite keeps the runner's own Node.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Use the release job's npm
        run: |
          npm install -g npm@^11.15.0
          npm --version

      - name: Pack pre-flight
        # What every published tarball would carry, checked on every PR instead
        # of first at release time, when a gap has already reached npm: each
        # entry point built, each `files` entry packed, README.md, LICENSE and
        # NOTICE in place. npm drops a file from a tarball without a word, so
        # the verdict is npm's own `npm pack --dry-run` list for each package.
        # It runs the release job's own two steps over the dist/ the Typecheck
        # step emitted (`tsc -b` builds), with the registry left out — ownership
        # is checked by the release job, which can reach npm. Last, because
        # release-prep rewrites every package.json the way the release does.
        run: |
          bun scripts/release-prep.ts --version 0.0.0-ci --for-publish
          bun scripts/publish-workspace.ts --dry-run --no-registry

      - name: Node load smoke
        # Every package that declares engines.node, packed with its internal
        # closure, installed into a temp project and loaded and type-checked
        # under the Node set up above. Over the tree the pack pre-flight built
        # and stamped.
        run: bun scripts/node-load-smoke.ts

  # HM-188 — the harness manager's process layer, executed on Windows.
  #
  # `createWindowsProcessOps` (PowerShell `Get-Process` for liveness and start
  # time, `taskkill /T` for the tree) shipped with the process layer but had
  # never RUN on Windows: nothing in CI ran it, and release.yml's
  # windows-latest job verifies that the packaged .exe downloads rather than
  # that the supervisor works. A wrong liveness verdict is the one failure
  # with real consequences — it is what lets a restart spawn a second copy of
  # a channel daemon — and Windows binaries ship through Scoop and winget, so
  # there are real users behind the gap. This job closes it.
  #
  # Scoped to the two packages that own supervision rather than `bun run test`:
  # the rest of the repo is platform-agnostic, and a second full matrix would
  # buy minutes of runtime for no new signal.
  #
  # GATING. It was non-blocking while the suites had never executed on this
  # platform — a red result then was information, not a reason to stop every
  # merge and every release. Its first run found six real bugs (path handling,
  # not the predicted spawn problem; two of them containment checks using
  # `startsWith(root + "/")`, which never matches on Windows because `resolve`
  # yields `D:\a\b\c`). Those are fixed and both suites are green here, so the
  # reason for the exemption is gone: from now on a Windows regression stops
  # the merge, exactly like a POSIX one. The win32 "unverified" notice was
  # deleted in the same change — it was a statement about CI, and CI can now
  # make the statement itself.
  windows-supervision:
    name: Supervisor + Hangar server (Windows)
    runs-on: windows-latest
    # A green run takes under 2 min; see `ci` for why every job has a bound.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # Pinned, not floated, and pinned to the supported floor
          # (apps/cli/src/bun-floor.ts; scripts/bun-floor.test.ts holds every
          # pin equal to it), so this job is what proves the floor before a
          # tag: release.yml's build waits on it.
          # - bun 1.4.0 (released 2026-08-19) wedges the Test step on
          #   ubuntu-latest: every package suite completes and
          #   `bun run --filter` then never exits, idling until the job
          #   timeout (runs 32820039193 and 32825788241).
          # - bun 1.3.11 fails @crewhaus/tool-safety on ubuntu-latest: a
          #   regex worker it terminated kept running for the whole batch,
          #   and its String.prototype.replace disagreed with the spec on a
          #   surrogate pair (run 36615945808). Both pass on 1.3.13 and 1.3.14
          #   on Linux arm64, on 1.3.14 on macOS, and with the x64 builds of
          #   1.3.13 and 1.3.14 on macOS under Rosetta.
          # Re-float once a 1.4.x fixes the parent-exit hang.
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test the process layer + the manager server
        run: bun --filter '@crewhaus/harness-supervisor' --filter '@crewhaus/hangar-server' --filter '@crewhaus/control-records' --filter '@crewhaus/control-service' --filter '@crewhaus/people' --filter '@crewhaus/people-service' test

  # reliability#7 — the tool packages that shell out to OS programs, on
  # Windows. `ci` runs them on ubuntu only, while tool-desktop ships
  # PowerShell backends its own comments marked DOCUMENTED, NOT RECORDED;
  # that is how 0.7.0 shipped a printer probe that cut "Microsoft Print to
  # PDF" to "Microsoft". tool-desktop's windows-recording.test.ts runs the
  # read-only probes here and logs their raw output (a runner is a service
  # session, so the log records shapes, not a desktop's answers).
  #
  # NON-GATING, as windows-supervision was until its first green run:
  # tool-proc's suite still holds POSIX argv without platform gates, and
  # release.yml reuses this workflow, so a red job here must not block a
  # tag. Make it gating (drop continue-on-error) once it is green.
  #
  # Non-gating is not the same as not waited for: release.yml's build needs
  # this workflow, so it waits for this job to finish, red or green. The
  # timeout keeps a hang here from holding a tag for GitHub's 6 h default.
  #
  # @crewhaus/tool-safety is here for its own win32 branches (taskkill /T in
  # spawnBounded, the Windows fallback in the fs checks), which the packages
  # above only reach indirectly.
  windows-tools:
    name: OS-backed tool packages (Windows, non-gating)
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # The same pin as `ci` and windows-supervision; see `ci` for why.
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test the OS-backed tool packages
        run: bun --filter '@crewhaus/tool-desktop' --filter '@crewhaus/tool-proc' --filter '@crewhaus/tool-cron' --filter '@crewhaus/tool-host' --filter '@crewhaus/tool-hostfs' --filter '@crewhaus/tool-pkgmgr' --filter '@crewhaus/tool-safety' test

  # The console in a real browser, against a seeded fleet, on every change.
  #
  # Three shards run beside `ci`, each budgeted inside its time, because every merge
  # costs the slower of `ci` and these. All three need ubuntu-24.04: the pinned
  # Playwright refuses to install chromium on ubuntu-latest (see smoke-runtime.yml).
  # They take no secret, so a fork's pull request runs all of them. What they upload
  # holds only runtime-made test values on dead loopback ports.
  #
  # The sweep's skip is safe to require: a job skipped by its `if` reports success.
  # But so does a job skipped because something it needs failed, so the check to
  # require is the `ui-e2e` aggregate at the end, never a shard.
  ui-e2e-scope:
    name: ui-e2e scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      axe: ${{ steps.scope.outputs.axe }}
    steps:
      # On a pull request the checkout is the merge commit, so its first parent's
      # diff is exactly what the pull request changes.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # The same pin as `ci`; see `ci` for why.
          bun-version: "1.3.14"
      - name: Decide whether the accessibility sweep runs
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        # --no-renames lists both sides of a move, so a file moved out of the console
        # still counts. -z stops git quoting an odd path past the prefix check. A
        # failed diff reaches the script as empty stdin, and that runs the sweep.
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git diff --name-only --no-renames -z HEAD^1 HEAD | bun scripts/ui-e2e-scope.ts
          else
            echo "axe=true" >> "$GITHUB_OUTPUT"
          fi

  ui-e2e-smoke:
    name: ui-e2e console smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # The same pin as `ci`; see `ci` for why.
          bun-version: "1.3.14"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package.json') }}
      # Both halves, as smoke-runtime.yml explains: the package from the install
      # above, and the matching browser from here.
      - name: Install Playwright chromium
        run: |
          bun -e 'await import("playwright")' || {
            echo "::error title=playwright package missing::playwright must resolve from node_modules for the chromium driver — restore the root devDependency (installing only the browser binaries is not enough)"
            exit 1
          }
          bunx playwright install --with-deps chromium
      - name: Run the journeys
        env:
          HANGAR_E2E_SHARD: smoke
          HANGAR_E2E_ARTIFACTS: ${{ runner.temp }}/hangar-e2e
        run: bun run --cwd packages/hangar-e2e test:browser
      - name: Upload traces and reports
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: ui-e2e-smoke
          path: ${{ runner.temp }}/hangar-e2e
          if-no-files-found: ignore
          retention-days: 7

  ui-e2e-axe:
    name: ui-e2e axe sweep
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: ui-e2e-scope
    # !cancelled() removes the implicit success(), so a failed scope job runs the
    # sweep instead of skipping into a false green.
    if: ${{ !cancelled() && (needs.ui-e2e-scope.result != 'success' || needs.ui-e2e-scope.outputs.axe != 'false') }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # The same pin as `ci`; see `ci` for why.
          bun-version: "1.3.14"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package.json') }}
      - name: Install Playwright chromium
        run: |
          bun -e 'await import("playwright")' || {
            echo "::error title=playwright package missing::playwright must resolve from node_modules for the chromium driver — restore the root devDependency (installing only the browser binaries is not enough)"
            exit 1
          }
          bunx playwright install --with-deps chromium
      - name: Run the journeys
        env:
          HANGAR_E2E_SHARD: axe
          HANGAR_E2E_ARTIFACTS: ${{ runner.temp }}/hangar-e2e
        run: bun run --cwd packages/hangar-e2e test:browser
      - name: Upload traces and reports
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: ui-e2e-axe
          path: ${{ runner.temp }}/hangar-e2e
          if-no-files-found: ignore
          retention-days: 7

  ui-e2e-system:
    name: ui-e2e system journeys
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # The same pin as `ci`; see `ci` for why.
          bun-version: "1.3.14"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package.json') }}
      - name: Install Playwright chromium
        run: |
          bun -e 'await import("playwright")' || {
            echo "::error title=playwright package missing::playwright must resolve from node_modules for the chromium driver — restore the root devDependency (installing only the browser binaries is not enough)"
            exit 1
          }
          bunx playwright install --with-deps chromium
      - name: Run the journeys
        env:
          HANGAR_E2E_SHARD: system
          HANGAR_E2E_ARTIFACTS: ${{ runner.temp }}/hangar-e2e
        run: bun run --cwd packages/hangar-e2e test:browser
      - name: Upload traces and reports
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: ui-e2e-system
          path: ${{ runner.temp }}/hangar-e2e
          if-no-files-found: ignore
          retention-days: 7

  # The one check name the ruleset can require; never rename it. A shard skipped
  # because something it needs failed also reads as success, so only this job can
  # say whether they all really passed.
  ui-e2e:
    name: ui-e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    needs: [ui-e2e-scope, ui-e2e-smoke, ui-e2e-axe, ui-e2e-system]
    if: always()
    steps:
      - name: Every shard passed, or the sweep had nothing to look at
        env:
          SMOKE: ${{ needs.ui-e2e-smoke.result }}
          AXE: ${{ needs.ui-e2e-axe.result }}
          SYSTEM: ${{ needs.ui-e2e-system.result }}
        run: |
          status=0
          if [ "$SMOKE" != "success" ]; then
            echo "console smoke: $SMOKE"
            status=1
          fi
          if [ "$SYSTEM" != "success" ]; then
            echo "system journeys: $SYSTEM"
            status=1
          fi
          if [ "$AXE" != "success" ] && [ "$AXE" != "skipped" ]; then
            echo "axe sweep: $AXE"
            status=1
          fi
          exit "$status"
