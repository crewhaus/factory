name: Smoke (runtime)

# Opt-in runtime smoke for the runnable target shapes (cli + browser).
# Issues real Anthropic API calls and asserts each agent actually used
# the tools it was given:
#   - browser: agent calls Navigate + Screenshot and grounds its answer
#     in a locally-served fixture page (randomised magic phrase).
#   - cli: agent calls the `read` tool on a randomised file and grounds
#     its answer in the file content.
# Catches the "compiled + booted but didn't actually use the tools"
# failure mode — see PR #108 for the canonical example.
#
# Gated on the ANTHROPIC_API_KEY repository secret existing. Forks /
# external PRs don't get the secret, so this job is automatically a
# no-op for them.
on:
  # Dispatch-only: this job issues real Anthropic API calls, so it runs only
  # when explicitly requested, keeping API spend predictable and avoiding an
  # unattended schedule that fails (not skips) whenever ANTHROPIC_API_KEY is
  # absent. Run it from the Actions tab before a release or after a runtime
  # change.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-runtime:
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'crewhaus/factory' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ">=1.2.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright chromium
        run: bunx playwright install --with-deps chromium

      - name: Runtime smoke (cli + browser)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Make the runtime tests fail (not skip) if the secret somehow
          # isn't set when this job runs.
          CREWHAUS_RUNTIME_SMOKE_REQUIRED: "1"
        run: bun run test:smoke:runtime
