name: Smoke (runtime)

# Runtime smoke for the runnable target shapes (cli + browser).
# Issues real Anthropic API calls and asserts each agent actually used
# the tools it was given:
#   - browser: agent calls Navigate + Screenshot and grounds its answer
#     in a locally-served fixture page (randomised magic phrase).
#   - cli: agent calls the `read` tool on a randomised file and grounds
#     its answer in the file content.
# Catches the "compiled + booted but didn't actually use the tools"
# failure mode — see PR #108 for the canonical example.
#
# Item 33 — this runs on three triggers:
#   - schedule: nightly, budget-capped by pinning the cheapest capable model
#     via CREWHAUS_SMOKE_MODEL (2 runs/night; the fixtures' default models
#     stay untouched for the other triggers), so runtime drift is caught
#     within a day instead of at the next manual dispatch.
#   - workflow_call: release.yml `uses:` this workflow as its publish gate —
#     no channel ships until the runtime smoke is green for the tag.
#   - workflow_dispatch: on demand from the Actions tab after a runtime change.
#
# The job requires the ANTHROPIC_API_KEY repository secret and FAILS (not
# skips) without it (CREWHAUS_RUNTIME_SMOKE_REQUIRED=1) — an unattended
# green must never mean "silently skipped". The `github.repository` guard
# keeps forks (which have neither the secret nor the schedule) at no-op.
on:
  schedule:
    # Nightly at 04:47 UTC — off the top of the hour to dodge the cron rush.
    - cron: "47 4 * * *"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  smoke-runtime:
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'crewhaus/factory' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ">=1.2.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # TWO halves, both required — this is what silently broke the browser
      # smoke for weeks. `bun install` puts the playwright PACKAGE in the tree
      # (root devDependency, pinned); this step adds the matching BROWSER
      # binaries. Installing only the browsers leaves the chromium driver's
      # `import("playwright")` failing at runtime, which exits `crewhaus run`
      # ~450ms in with no session log — a boot failure that reads like flake.
      # The preflight asserts the package half, so a dropped dependency names
      # itself instead of hiding behind a cryptic non-zero exit.
      #
      # bunx resolves the repo-pinned CLI (node_modules/.bin), so the browser
      # build ids match the package that imports them; an unpinned
      # `playwright@latest` would fetch a different chromium revision than the
      # runtime looks for.
      - name: Install Playwright chromium
        run: |
          bun -e 'await import("playwright")' || {
            echo "::error title=playwright package missing::playwright must resolve from node_modules for the chromium driver — restore the root devDependency (installing only the browser binaries is not enough)"
            exit 1
          }
          bunx playwright install --with-deps chromium

      - name: Runtime smoke (cli + browser)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Make the runtime tests fail (not skip) if the secret somehow
          # isn't set when this job runs.
          CREWHAUS_RUNTIME_SMOKE_REQUIRED: "1"
          # Budget cap for the unattended nightly: pin the cheapest capable
          # model (the harness forwards this as `crewhaus run --model`).
          # Empty string = unset, so dispatch and release-gate runs exercise
          # the fixtures' default models.
          CREWHAUS_SMOKE_MODEL: ${{ github.event_name == 'schedule' && 'claude-haiku-4-5-20251001' || '' }}
        run: bun run test:smoke:runtime
