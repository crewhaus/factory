name: Release

# Cuts a CrewHaus release across every distribution channel:
#   • self-contained `crewhaus` binaries (linux/macos/windows × x64/arm64)
#     attached to a GitHub Release
#   • npm: the bare `crewhaus` package + all @crewhaus/* libraries
#   • Homebrew tap   → crewhaus/homebrew-tap   (brew install crewhaus/tap/crewhaus)
#   • Scoop bucket   → crewhaus/scoop-bucket   (scoop install crewhaus)
#   • apt repo       → crewhaus/apt (gh-pages) (apt install crewhaus)
#   • winget         → microsoft/winget-pkgs   (winget install CrewHaus.CLI)
#   • GHCR           → ghcr.io/crewhaus/<target> (item 47 — one image per
#                      target shape with a Dockerfile; the pushed digests are
#                      recorded back into docker/digests.json on main)
#
# Trigger: push a tag like `v0.1.3`, or run manually with a version input.
#
# Required repository secrets:
#   NPM_TOKEN             classic npm *Automation* token (2FA-exempt; see PACKAGES.md)
#   RELEASE_PAT          PAT with `repo` scope + write to crewhaus/homebrew-tap,
#                        crewhaus/scoop-bucket, crewhaus/apt
#   APT_GPG_PRIVATE_KEY  ASCII-armored private key used to sign the apt repo
#   APT_GPG_PASSPHRASE   passphrase for that key ("" if none)
#   WINGET_TOKEN         PAT with `public_repo` for the winget-pkgs fork (optional)
#
# Each channel is an independent job (needs: build) so one channel failing does
# not block the others. Re-run a single failed job from the Actions UI.
#
# Item 33 — the whole fan-out is gated on a green runtime smoke for the tag:
# `build` needs `smoke-runtime` (which reuses .github/workflows/smoke-runtime.yml
# via workflow_call and the same ANTHROPIC_API_KEY repository secret), and every
# channel job needs `build`, so nothing — not even the GitHub Release itself —
# ships if the runtime smoke is red.
#
# Security: every ${{ }} value that flows into a `run:` block is passed via
# `env:` (never inlined into the shell), per the workflow-injection guidance.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 0.1.3 (no leading v)"
        required: true
        type: string

permissions:
  contents: write # create the GitHub Release + upload assets

env:
  HOMEPAGE: https://github.com/crewhaus/factory

jobs:
  smoke-runtime:
    name: Runtime smoke gate
    # Item 33 — a release cannot ship without the runtime smoke (real
    # `crewhaus run` + tool-use assertions) going green for this tag. Reuses
    # the Smoke (runtime) workflow; `secrets: inherit` hands it the existing
    # ANTHROPIC_API_KEY repository secret (no new secret names).
    uses: ./.github/workflows/smoke-runtime.yml
    secrets: inherit

  ci:
    name: Full CI gate (lint + typecheck + test)
    # A release must clear the same static + test bar as a PR into main.
    # v0.3.0 shipped from a lint-red tree because the only publish gate was
    # smoke-runtime — reuse the CI workflow so a tagged tree that would fail
    # `bun run lint | typecheck | test` can never publish. Reused (not
    # duplicated) so the release bar stays identical to the PR bar, mirroring
    # the smoke-runtime reuse above.
    uses: ./.github/workflows/ci.yml

  build:
    name: Build binaries + manifests + GitHub Release
    # Gating build gates the whole fan-out: every publish job `needs: build`.
    needs: [smoke-runtime, ci]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      download_base_url: ${{ steps.version.outputs.download_base_url }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ">=1.2.0"

      - name: Resolve version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${REF_NAME#v}"
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::Version '$VERSION' is not semver-shaped"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "download_base_url=$HOMEPAGE/releases/download/v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build all binaries (version embedded via --define)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bun packages/single-binary-cli/src/cli.ts --version "$VERSION"

      # Actually EXECUTE a compiled binary. The build step above only compiles;
      # nothing else in CI runs a produced binary (smoke-runtime runs from
      # source via bun), so a binary that crashes at startup — e.g. an eager
      # readFileSync of a package-relative path that resolves under /$bunfs and
      # ENOENTs — shipped green. This step runs the artifact matching the
      # runner (ubuntu-latest = linux-x64) and asserts `--version` works.
      - name: Smoke-test the compiled linux-x64 binary
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          BIN="dist/crewhaus-linux-x64-$VERSION"
          test -f "$BIN" || { echo "::error::$BIN was not built"; exit 1; }
          chmod +x "$BIN"
          # (1) exit 0 — a crashing/segfaulting --version fails here under `set -e`
          "$BIN" --version
          # (2) it printed the embedded version — guards a bad --define / stale embed
          OUT="$("$BIN" --version)"
          if [ "$OUT" != "$VERSION" ]; then
            echo "::error::crewhaus --version printed '$OUT', expected '$VERSION'"; exit 1
          fi
          echo "compiled linux-x64 binary smoke OK: $OUT"

      - name: Generate package manifests
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DOWNLOAD_BASE_URL: ${{ steps.version.outputs.download_base_url }}
        run: |
          bun packages/single-binary-cli/src/manifests.ts \
            --version "$VERSION" \
            --homepage "$HOMEPAGE" \
            --download-base-url "$DOWNLOAD_BASE_URL" \
            --dist "$PWD/dist" \
            --out "$PWD/packaging"

      - name: Create GitHub Release with binaries
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          # Idempotent: create the release, or (on re-run) re-upload the assets.
          gh release create "v$VERSION" \
            --repo "$REPO" \
            --title "crewhaus v$VERSION" \
            --generate-notes \
            dist/crewhaus-* \
          || gh release upload "v$VERSION" --repo "$REPO" --clobber dist/crewhaus-*

      - name: Upload manifests artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: packaging
          path: packaging/

      - name: Upload linux binaries artifact (for apt .deb build)
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: linux-binaries
          path: dist/crewhaus-linux-*

  npm:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ">=1.2.0"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build packages (tsc -b → dist/*.js + .d.ts)
        # Compile every publishable package to dist BEFORE stamping. The committed
        # tree points entrypoints at src/*.ts (Bun dev needs no build); the next step
        # flips them to the dist output this produces. Build first, while package.json
        # still resolves cross-package imports to src, then rewrite to dist.
        run: bun run build
      - name: Stamp version metadata + flip entrypoints to dist
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: bun scripts/release-prep.ts --version "$VERSION" --for-publish
      - name: Publish (crewhaus + @crewhaus/*)
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # `bun publish` does NOT read ~/.npmrc's `_authToken` (verified: on the
          # bun 1.3.14 CI runner, `npm whoami` authenticates via .npmrc but every
          # `bun publish` dies with "missing authentication (run `bunx npm
          # login`)"). bun authenticates ONLY via NPM_CONFIG_TOKEN — see the
          # preflight in scripts/publish-workspace.ts. NPM_TOKEN is a classic npm
          # *Automation* token (2FA-exempt), so there is no web-OTP prompt.
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Conversely, the script's `npm whoami` preflight and `npm view`
          # ownership/skip checks IGNORE NPM_CONFIG_TOKEN (npm warns "Unknown env
          # config token") — they need the .npmrc `_authToken`. So write BOTH:
          # .npmrc for the npm calls, NPM_CONFIG_TOKEN (above) for bun publish.
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          bun scripts/publish-workspace.ts

  homebrew:
    name: Update Homebrew tap
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download manifests
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          name: packaging
          path: packaging
      - name: Push formula to crewhaus/homebrew-tap
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/crewhaus/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp packaging/Formula/crewhaus.rb tap/Formula/crewhaus.rb
          cd tap
          git config user.name "crewhaus-release-bot"
          git config user.email "release@crewhaus.ai"
          git add Formula/crewhaus.rb
          git commit -m "crewhaus $VERSION" || { echo "no change"; exit 0; }
          git push

  scoop:
    name: Update Scoop bucket
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download manifests
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          name: packaging
          path: packaging
      - name: Push manifest to crewhaus/scoop-bucket
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/crewhaus/scoop-bucket.git" bucket
          mkdir -p bucket/bucket
          cp packaging/scoop.json bucket/bucket/crewhaus.json
          cd bucket
          git config user.name "crewhaus-release-bot"
          git config user.email "release@crewhaus.ai"
          git add bucket/crewhaus.json
          git commit -m "crewhaus $VERSION" || { echo "no change"; exit 0; }
          git push

  apt:
    name: Build + sign apt repo
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download linux binaries
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          name: linux-binaries
          path: bin
      - name: Build .deb packages and signed apt repo
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils gnupg
          # Import the signing key.
          printf '%s' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          KEYID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec:/ {print $5; exit}')
          # Build one .deb per linux arch.
          for arch in amd64 arm64; do
            case "$arch" in
              amd64) src="bin/crewhaus-linux-x64-$VERSION" ;;
              arm64) src="bin/crewhaus-linux-arm64-$VERSION" ;;
            esac
            pkgdir="pkg-$arch/crewhaus_${VERSION}_${arch}"
            mkdir -p "$pkgdir/DEBIAN" "$pkgdir/usr/bin"
            install -m0755 "$src" "$pkgdir/usr/bin/crewhaus"
            {
              echo "Package: crewhaus"
              echo "Version: ${VERSION}"
              echo "Section: utils"
              echo "Priority: optional"
              echo "Architecture: ${arch}"
              echo "Maintainer: CrewHaus Maintainers <maintainers@crewhaus.ai>"
              echo "Depends: libc6 (>= 2.31)"
              echo "Description: Modular meta-harness — compile a single spec into multiple agent runtimes"
            } > "$pkgdir/DEBIAN/control"
            dpkg-deb --build --root-owner-group "$pkgdir"
          done
          # Assemble the apt repo (flat dists/stable/main).
          git clone "https://x-access-token:${GH_TOKEN}@github.com/crewhaus/apt.git" apt-repo
          cd apt-repo
          git checkout gh-pages 2>/dev/null || git checkout --orphan gh-pages
          mkdir -p pool/main dists/stable/main/binary-amd64 dists/stable/main/binary-arm64
          cp ../pkg-*/crewhaus_*.deb pool/main/
          for arch in amd64 arm64; do
            dpkg-scanpackages --arch "$arch" pool/main > "dists/stable/main/binary-$arch/Packages"
            gzip -kf "dists/stable/main/binary-$arch/Packages"
          done
          # Export the public key for users.
          gpg --armor --export "$KEYID" > key.gpg
          # Release file + signatures.
          cd dists/stable
          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin=CrewHaus \
            -o APT::FTPArchive::Release::Label=CrewHaus \
            -o APT::FTPArchive::Release::Suite=stable \
            -o APT::FTPArchive::Release::Codename=stable \
            -o APT::FTPArchive::Release::Architectures="amd64 arm64" \
            -o APT::FTPArchive::Release::Components=main \
            release . > Release
          printf '%s' "$APT_GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            -abs -u "$KEYID" -o Release.gpg Release
          printf '%s' "$APT_GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --clearsign -u "$KEYID" -o InRelease Release
          cd ../..
          git config user.name "crewhaus-release-bot"
          git config user.email "release@crewhaus.ai"
          git add -A
          git commit -m "crewhaus $VERSION" || { echo "no change"; exit 0; }
          git push origin gh-pages

  winget:
    name: Submit to winget
    needs: build
    runs-on: windows-latest
    steps:
      - name: wingetcreate update CrewHaus.CLI
        shell: pwsh
        env:
          VERSION: ${{ needs.build.outputs.version }}
          DOWNLOAD_BASE_URL: ${{ needs.build.outputs.download_base_url }}
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if (-not $env:WINGET_TOKEN) { Write-Host "WINGET_TOKEN not set — skipping winget submission"; exit 0 }
          $url = "$env:DOWNLOAD_BASE_URL/crewhaus-windows-x64-$env:VERSION.exe"
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          .\wingetcreate.exe update CrewHaus.CLI --version $env:VERSION --urls "$url|x64|portable" --submit --token $env:WINGET_TOKEN

  # ── Container images (item 47) ──────────────────────────────────────────────
  # One GHCR image per target shape with a Dockerfile, then the pushed digests
  # are recorded back into docker/digests.json — the lockfile the file's own
  # header promises `crewhaus build-image` maintains (locally it now does, and
  # this closes the loop for CI-published tags).

  docker-targets:
    name: Enumerate image target shapes
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.list.outputs.targets }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: List per-shape Dockerfiles
        id: list
        # The matrix mirrors TARGET_SHAPES in packages/docker-images — one dir
        # per shape under docker/<target>/Dockerfile. Enumerated from disk so a
        # new shape's Dockerfile is picked up without editing this workflow.
        run: |
          targets=$(find packages/docker-images/docker -mindepth 2 -maxdepth 2 -name Dockerfile \
            | sed 's|.*/docker/\(.*\)/Dockerfile|\1|' | sort | jq -R . | jq -sc .)
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  docker:
    name: Publish images to GHCR
    needs: [build, docker-targets]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push ghcr.io/crewhaus/<target>
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.docker-targets.outputs.targets) }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
      - name: Build + push image
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.build.outputs.version }}
        # Same argv shape as @crewhaus/docker-images' buildImage() (per-shape
        # Dockerfile against the workspace-root context); buildImage itself only
        # knows local `crewhaus/<target>` refs, so CI tags the ghcr.io refs
        # directly. `:latest` only moves for stable X.Y.Z releases — a
        # pre-release tag (0.2.0-rc.1) must never become what `:latest` pulls.
        # Follow-up (documented, not yet built): multi-arch publishing via
        # `--platform linux/amd64,linux/arm64` needs QEMU/binfmt setup on the
        # runner; today's images are single-arch (the runner's native amd64).
        run: |
          TAGS=(--tag "ghcr.io/crewhaus/$TARGET:$VERSION")
          if printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            TAGS+=(--tag "ghcr.io/crewhaus/$TARGET:latest")
          else
            echo "pre-release version $VERSION — not moving :latest"
          fi
          docker buildx build \
            --file "packages/docker-images/docker/$TARGET/Dockerfile" \
            "${TAGS[@]}" \
            --push \
            .

  docker-digests:
    name: Record image digests
    # docker-targets is a direct need so this job consumes the SAME target list
    # the docker job built from the tag's checkout — re-enumerating Dockerfiles
    # here would list main's shapes, not the tag's.
    needs: [build, docker, docker-targets]
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit the updated docker/digests.json back to main
      # Job-level permissions REPLACE the workflow defaults (they don't merge),
      # so packages must be granted explicitly or the GHCR login below cannot
      # read the freshly-pushed (private-at-first-publish) packages.
      packages: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # v* tags are cut from main and the lockfile commit lands there too
          # (main's ruleset allows the bot's direct push — no require-PR).
          ref: main
          token: ${{ secrets.RELEASE_PAT }} 
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ">=1.2.0"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Log in to GHCR
        # imagetools inspect needs auth while the freshly-pushed packages are
        # still private (first-publish default).
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
      - name: Record pushed digests into docker/digests.json
        env:
          VERSION: ${{ needs.build.outputs.version }}
          # The docker-targets output was enumerated from the TAG's checkout;
          # this job checks out main (for the lockfile commit), so re-listing
          # Dockerfiles here could disagree with what the docker job pushed.
          TARGETS_JSON: ${{ needs.docker-targets.outputs.targets }}
        run: |
          TARGETS=$(printf '%s' "$TARGETS_JSON" | jq -r 'join(",")')
          bun scripts/record-image-digests.ts --version "$VERSION" --targets "$TARGETS"
      - name: Commit digests.json back to main
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          git config user.name "crewhaus-release-bot"
          git config user.email "release@crewhaus.ai"
          git add packages/docker-images/docker/digests.json
          # Explicit no-op check: `git commit || exit 0` also swallowed REAL
          # commit failures (hooks, config, disk) — those must fail the job.
          if git diff --cached --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "chore(release): record GHCR image digests for v$VERSION"
          # main can move while this job runs (other channel jobs, humans) —
          # retry the push with a rebase between attempts instead of failing
          # the whole release fan-out on the first non-fast-forward.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push attempt $attempt failed — rebasing onto origin/main and retrying"
            git pull --rebase origin main
          done
          echo "::error::could not push digests.json to main after 3 attempts"
          exit 1
